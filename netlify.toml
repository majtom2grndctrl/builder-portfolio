[build]
  command = "pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  # Public, client-side values — safe to commit.
  PUBLIC_SANITY_PROJECT_ID = "ylv78mng"
  PUBLIC_SANITY_DATASET = "production"
  PUBLIC_POSTHOG_KEY = "phc_qjWT5YbSDMsLXyJXMSPoXZFT8wgFz88y88k3QzEP25yA"
  PUBLIC_POSTHOG_HOST = "https://us.i.posthog.com"

# Sanity Studio is a single-page app: send every /studio/* path to its shell.
[[redirects]]
  from = "/studio/*"
  to = "/studio/index.html"
  status = 200

[[headers]]
  for = "/studio/*"
  [headers.values]
    X-Robots-Tag = "noindex"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
